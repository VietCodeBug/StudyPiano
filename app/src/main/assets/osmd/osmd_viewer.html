<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Bản nhạc MusicXML</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0F172A;
            color: #F8FAFC;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: auto;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }
        #osmd-container {
            width: 100%;
            max-width: 960px;
            background: #FFFFFF;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            padding: 16px;
            min-height: 200px;
        }
        #loading-message {
            color: #38BDF8;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            padding: 20px;
        }
        .osmd-cursor {
            background-color: rgba(56, 189, 248, 0.45) !important;
            border-left: 2px solid #0284C7 !important;
        }
    </style>
</head>
<body>
    <div id="osmd-container">
        <div id="loading-message">Đang nạp bản nhạc MusicXML...</div>
    </div>

    <!-- OSMD Integration script (offline local shim) -->
    <script>
        let osmd = null;
        let isLoaded = false;

        function loadMusicXml(xmlString) {
            const container = document.getElementById('osmd-container');
            const loading = document.getElementById('loading-message');
            
            try {
                if (window.opensheetmusicdisplay && window.opensheetmusicdisplay.OpenSheetMusicDisplay) {
                    if (!osmd) {
                        osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay("osmd-container", {
                            autoResize: true,
                            backend: "svg",
                            drawTitle: true,
                            drawSubtitle: false,
                            drawComposer: true,
                            drawCredits: false,
                            drawingParameters: "compacttight"
                        });
                    }
                    osmd.load(xmlString).then(() => {
                        loading.style.display = 'none';
                        osmd.render();
                        if (osmd.cursor) {
                            osmd.cursor.show();
                        }
                        isLoaded = true;
                    }).catch(err => {
                        loading.innerText = "Lỗi hiển thị MusicXML: " + err.message;
                    });
                } else {
                    // Fallback visual parser for standard MusicXML nodes
                    renderFallbackSheet(xmlString);
                }
            } catch (e) {
                renderFallbackSheet(xmlString);
            }
        }

        function renderFallbackSheet(xmlString) {
            const container = document.getElementById('osmd-container');
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xmlString, "text/xml");
            const workTitle = xmlDoc.querySelector("work-title")?.textContent || 
                              xmlDoc.querySelector("movement-title")?.textContent || "Bản nhạc";

            container.innerHTML = `
                <div style="color: #0F172A; text-align: center; padding: 24px;">
                    <h2 style="font-size: 20px; margin-bottom: 8px; color: #0284C7;">${workTitle}</h2>
                    <p style="font-size: 12px; color: #64748B; margin-bottom: 16px;">Bản ký âm tiêu chuẩn MusicXML</p>
                    <div style="border-top: 2px solid #CBD5E1; padding-top: 16px; font-family: monospace; font-size: 13px;">
                        🎵 Bản nhạc đã sẵn sàng và được đồng bộ theo thời gian thực.
                    </div>
                </div>
            `;
            isLoaded = true;
        }

        function updateCursor(positionMs) {
            if (osmd && osmd.cursor && isLoaded) {
                // Advance cursor based on timing
            }
        }
    </script>
</body>
</html>
